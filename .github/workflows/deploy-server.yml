name: Deploy online server

# Publishes the Cloudflare Worker in server/. Needs the repository secret CLOUDFLARE_API_TOKEN
# (a token with "Edit Cloudflare Workers" permission). Without it this workflow does nothing.
on:
  push:
    branches: [main]
    paths:
      - server/**
      - src/core/**
      - src/server/**
      - src/meta/rating.ts
      - .github/workflows/deploy-server.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # the secret for reading game records (wiki #admin, npm run logs); optional
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      # only needed when the token can see more than one Cloudflare account
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for token
        id: token
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "have=true" >> "$GITHUB_OUTPUT"; else echo "CLOUDFLARE_API_TOKEN is not set; skipping." ; fi
      - uses: actions/setup-node@v4
        if: steps.token.outputs.have == 'true'
        with:
          node-version: 22
      - name: Install
        if: steps.token.outputs.have == 'true'
        working-directory: server
        run: npm install --legacy-peer-deps
      - name: Deploy
        if: steps.token.outputs.have == 'true'
        working-directory: server
        run: npx wrangler deploy
      - name: Set the admin token
        if: steps.token.outputs.have == 'true' && env.ADMIN_TOKEN != ''
        working-directory: server
        run: printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN
