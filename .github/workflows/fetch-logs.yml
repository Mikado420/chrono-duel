# 対戦記録を暗号化して取り出す（分析用）: Actions → Fetch game logs → Run workflow
#   Downloads every game record of a version from the online server (needs Variables > ONLINE_URL and
#   Secrets > ADMIN_TOKEN), encrypts it with the public key below and pushes it to the `logs-enc` branch.
#   The repository is public, so the records are never stored in the clear; only the holder of the private key
#   (the analysis session that made it) can read them. Replace the key when a new session needs the records.
name: Fetch game logs

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'バージョン（空なら最新。空白区切りで複数可）'
        default: '0.22.0'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Download records
        env:
          SERVER: ${{ vars.ONLINE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          VER: ${{ inputs.version }}
        run: |
          for v in $VER; do npx tsx src/sim/logs.ts "$SERVER" "$ADMIN_TOKEN" $v > /dev/null; done
          [ -n "$VER" ] || npx tsx src/sim/logs.ts "$SERVER" "$ADMIN_TOKEN" > /dev/null
          # the ranking (public) next to the records
          base=$(echo "$SERVER" | sed -e 's#^ws#http#' -e 's#/$##')
          curl -sS -X POST "$base/api/ranking" -H 'content-type: application/json' -H 'origin: https://mikado420.github.io' -d '{}' > logs/ranking.jsonl
          # the wiki's 環境Tier (public) too
          curl -sS -X POST "$base/api/wiki" -H 'content-type: application/json' -H 'origin: https://mikado420.github.io' -d '{}' > logs/wiki.jsonl
      - name: Encrypt and push
        run: |
          set -e
          cat > /tmp/pub.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAw8rCezAZRG3qvgptXcnm
          QXs/GHBzpKQpPPN9BCN67M7Lxu+BdIhQRWXhCr64smcuJTbHAPYBDVqRlAZgy/UJ
          DArahk51H4Y/g4Hc5d0AEifbyEz15CeK72ggK6BtRF8B+LgbxOY/mqIlsunaUd4G
          nfjK85VY6DAhISMGrnXj/UxasZaOt+WlDQMRMgOD4RSLQkZeT0FlhITDbMwvsBSf
          jvrwP0AKj66DEpgHcJHB8pXEM6kbDJrDO8rFhZ5sywZvUjeqEOHZyc0AE5VXgRAO
          1it/CFGzCgwzrQOSN0dXxTDcamdbaQxgRyWUf89RoVtI70iGOqk9GKTxYGu0UzDQ
          NDbKrBnGa0WYOaW2asHwV+lJEUXXNh8fa/Gl7DVTgIEtTD68Ew1FVxK8bNzsBe8w
          jHIv6VudkmjpE5Tge8h8GwOz7GdpVG4uxPlwchrqFCVyYP3Cyt2yGu6/PGERLSdJ
          O7yVfNDn0m6kcdLmJ1PBQCjn7lILGS1nF5M4p54Nw7fNAgMBAAE=
          -----END PUBLIC KEY-----
          EOF
          sed -i 's/^ *//' /tmp/pub.pem
          mkdir -p /tmp/enc
          for f in logs/*.jsonl; do
            b=$(basename "$f" .jsonl)
            openssl rand -out /tmp/k 32
            gzip -9c "$f" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:/tmp/k -out "/tmp/enc/$b.jsonl.gz.enc"
            openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k -out "/tmp/enc/$b.key.enc"
            echo "$b: $(wc -l < "$f") games"
          done
          rm -f /tmp/k
          cd /tmp/enc
          git init -q -b logs-enc
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A && git commit -qm "encrypted game logs ($(date -u +%F))"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" logs-enc
