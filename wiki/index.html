      <section class="kv">

          <div class="en">TIME IS YOUR ONLY RESOURCE</div>
          <p class="kv-h">ターンのない対戦カードゲーム</p>
          <p>すべての行動は「刻」を払い、時計が遅れている方が次に動く。毎日更新の環境Tier、全<span data-v="TYPE_COUNT"></span>タイプ・<span data-v="BUILD_COUNT"></span>型のデッキ解説、全<span data-v="CARD_COUNT"></span>種のカード評価、レート戦のランクと報酬をまとめた攻略wikiです。</p>
        </div>

      <h2 id="h-decks">デッキ解説</h2>
      <p class="lead-s">レート戦で使われている<span data-v="TYPE_COUNT"></span>タイプ。タップするとレシピと立ち回りへ移ります。</p>
      <div class="tchips grid" id="home-types"></div>

      <h2 id="h-begin">はじめての人へ</h2>
      <div class="box">
        <ol class="steps">
          <li><a href="#rules" data-go="rules">基本ルール</a>の「時計」と「行動コスト」の表を読む。これだけで対戦はできます。</li>
          <li>最初のデッキは「均衡の刻」がおすすめ。攻守のバランスがよく、どの相手にも大きく負け越しません。</li>
          <li>パックのカードを手に入れたら、<a href="#keywords" data-go="keywords">キーワード</a>で残響・共鳴・急襲・充填を確認する。</li>
          <li>レート戦に挑むなら<a href="#tier" data-go="tier">環境Tier</a>と<a href="#decks" data-go="decks">デッキ解説</a>で、今勝っているデッキと立ち回りを確認する。</li>
          <li>勝てなくなってきたら<a href="#tips" data-go="tips">立ち回り</a>へ。鐘と終焉の使い方で勝率が変わります。</li>
        </ol>

    <template id="t-tier">
      <p class="lead-s" id="tier-when">読み込み中…</p>
      <h2 id="h-tierlist">Tier表</h2>
      <div id="tierlist2"></div>
      <h2 id="h-tiertable">デッキタイプ別の成績</h2>
      <p class="lead-s">点数は下の「Tierの決め方」で計算したもの。試合はレート戦（プレイヤーと対戦相手の両方の側）とフレンド対戦の合計で、「プレイヤー／相手」はそのタイプをプレイヤーが使った試合と、レート戦の対戦相手が使った試合です。</p>
      <div class="tw"><table class="gt" id="tiertable"></table></div>
      <h2 id="h-buildtable">型ごとの成績</h2>
      <div class="tw"><table class="gt" id="buildtable"></table></div>
      <h2 id="h-bands">ランクごとの使用率（プレイヤー）</h2>
      <p class="lead-s">レート戦で、そのランクのプレイヤーが使ったデッキの割合（上位3つ）。</p>
      <div class="tw"><table class="gt" id="bandtable"></table></div>
      <h2 id="h-how">Tierの決め方</h2>
      <div class="box">
        <ul class="dots">
          <li>直近7日の実際の試合を、デッキタイプごとに集計します。プレイヤーのデッキは、いちばん近いレシピのタイプに分けています（新しいデッキ分けが始まった10月14日より前の試合は数えません）。</li>
          <li><b>プレイヤーが使った試合</b>は、同じランクで使われた全デッキの勝率と比べます。同じランクなら当たる相手の強さがそろうので、デッキの差だけを比べられます。</li>
          <li><b>レート戦の対戦相手が使った試合</b>は、レート差から出る勝つ見込みとの差を、相手の全デッキの平均と比べます。フレンド対戦は50%と比べます。</li>
          <li>試合が少ないタイプほど0に寄せて計算します（試合数に<span data-v="TIER_SHRINK"></span>を足して割る）。</li>
          <li>さらに、<b>上位ランク（刻聖・刻神）での使用率</b>を足します（使用率100%で+<span data-v="USE_K"></span>点）。上位勢がこぞって使うデッキは、比べる相手がいなくても強いと見なします。</li>
          <li>点数が S＝<span data-v="TIER_S"></span>以上、A＝<span data-v="TIER_A"></span>以上、B＝<span data-v="TIER_B"></span>以上、C＝それ未満。<span data-v="TIER_MIN"></span>試合に満たないタイプは「集計中」です。</li>
          <li>毎日4:30ごろ（日本時間）に自動で更新します。矢印は前回の更新との比較です。</li>
        </ul>
      </div>
    </template>

    <template id="t-rated">
      <div id="season-box"></div>
      <h2 id="h-ranks">ランク一覧</h2>
      <p class="lead-s">レートが上がるとランクも上がり、対戦相手も強くなります。季末の報酬は、その季でいちばん高かったランクで決まります。</p>
      <div class="tw"><table class="gt" id="ranktable2"></table></div>
      <h2 id="h-shin">刻神Ⅰ〜Ⅴ</h2>
      <div class="box">
        <ul class="dots">
          <li>最高ランクの刻神は、レート2000から100ごとに刻神Ⅰ〜Ⅴの5段階です。</li>
          <li>刻神Ⅰ・Ⅱの相手はLv10、刻神Ⅲ・Ⅳの相手はLv11、刻神Ⅴの相手はLv12だけになります。</li>
          <li>Lv11とLv12は、1手に最大20秒考えます。</li>
          <li>刻神Ⅲ（2200）と刻神Ⅴ（2400）に届くと、それぞれ専用の称号がもらえます。</li>
        </ul>
      </div>
      <h2 id="h-season">季（シーズン）</h2>
      <div class="box">
        <ul class="dots">
          <li>新しい弾が出るたびに1つの季が終わり、次の季が始まります。</li>
          <li>季が変わると、レートは今のランクの1つ下のはじめに戻ります（見習いは1000のまま）。刻神Ⅰ〜Ⅴはどの段階でも刻聖（1800）からのスタートです。</li>
          <li>季の最高ランクに応じた報酬と、季の称号がもらえます。称号の端には、その季の最終順位が表示されます。</li>
        </ul>
      </div>
      <h2 id="h-lv">対戦相手のLv</h2>

      <h2 id="h-banddecks">ランクごとの相手のデッキ</h2>

    <template id="t-decks">

    <template id="t-rules">
      <h2 id="h-turn">ターンのかわりに「時計」</h2>
      <p>両プレイヤーはそれぞれ自分の時計を持ち、0刻から始まります。行動するたびに、その行動のコスト分だけ自分の時計が進みます。</p>
      <div class="box point"><b>次に動くのは、時計が遅れている方。</b>同じ刻なら、直前に動いていない方が動きます。片方が<span data-v="END"></span>刻に着いたら、もう片方が着くまで続けて動きます。</div>
      <div class="box clock">
        <p class="cap">時計の目盛り（0〜<span data-v="END"></span>刻）</p>
        <div class="tw"><svg viewBox="0 0 800 150" id="clocksvg" role="img" aria-label="時計の目盛り。鐘と終焉の刻を示す"></svg></div>
      </div>

      <h2 id="h-num">主な数値</h2>
      <div class="tw"><table class="gt">
        <tr><th>項目</th><th>値</th></tr>
        <tr><td>拠点の体力</td><td><b class="n" data-v="BASE_HP"></b>（回復しても上限はこの値）</td></tr>
        <tr><td>時計の終わり</td><td><b class="n" data-v="END"></b>刻</td></tr>
        <tr><td>デッキ</td><td><b class="n" data-v="DECK_SIZE"></b>枚。同名<span data-v="MAX_COPIES"></span>枚まで、伝説は<span data-v="MAX_LEGEND_COPIES"></span>枚</td></tr>
        <tr><td>初期手札 / 上限</td><td><b class="n" data-v="START_HAND"></b>枚 / <b class="n" data-v="MAX_HAND"></b>枚（あふれたカードは燃えて消える）</td></tr>
        <tr><td>レーン</td><td><b class="n" data-v="LANES"></b>つ。1レーンにユニット1体</td></tr>
        <tr><td>予約</td><td>同時に<b class="n" data-v="MAX_RESV"></b>つまで</td></tr>
        <tr><td>残響</td><td>同時に<b class="n" data-v="MAX_ECHO"></b>つまで（超えた分は不発）</td></tr>
      </table></div>

      <h2 id="h-cost">行動コスト</h2>
      <div class="tw"><table class="gt">
        <tr><th>行動</th><th class="num">刻</th><th>メモ</th></tr>
        <tr><td>カードを使う</td><td class="num"><b class="n">コスト</b></td><td>ユニットの召喚、術の即時発動</td></tr>
        <tr><td>予約する</td><td class="num"><b class="n">コスト</b></td><td>術を未来の時刻に伏せる</td></tr>
        <tr><td>攻撃</td><td class="num"><b class="n" data-v="COST_ATTACK"></b></td><td>準備ができたユニット1体で</td></tr>
        <tr><td>ドロー</td><td class="num"><b class="n" data-v="COST_DRAW"></b></td><td>山札が残っているときだけ</td></tr>
        <tr><td>待機</td><td class="num"><b class="n" data-v="COST_WAIT"></b></td><td>何もしない</td></tr>
      </table></div>

      <h2 id="h-bell">鐘と終焉</h2>
      <h3>鐘</h3>
      <p>自分の時計が <b class="n" data-v="BELLS"></b> 刻を越えるたびに、カードを1枚引きます。コストの大きい行動で2つの鐘を一度に越えれば2枚引けます。「鐘楼の歩哨」はこのタイミングで成長します。</p>
      <h3>終焉の刻</h3>
      <p>両者の時計の遅い方（世界の時刻）が <b class="n" data-v="DOOM_AT"></b> 刻に届くと、<b>ユニットの攻撃</b>で拠点に与えるダメージが<b>+1</b>されます。以降 <b class="n" data-v="DOOM_STEP"></b> 刻ごとにさらに+1（<span data-v="DOOM_LIST"></span>）。術や残響による拠点へのダメージには乗りません。</p>

      <h2 id="h-unit">ユニットと攻撃</h2>
      <ul class="dots">
        <li>召喚したユニットは、自分の時計が1刻進むと攻撃できます。<b>速攻</b>なら召喚直後から攻撃できます。</li>
        <li>攻撃すると、ユニットは「間隔」の刻数だけ次の攻撃を待ちます。</li>
        <li>攻撃先は同じレーンの敵ユニット。いなければ、隣のレーンにいる<b>挑発</b>ユニット（2体なら体力の多い方）が受け止めます。それもいなければ敵拠点へ。</li>
        <li>ユニット同士の戦闘は同時にダメージ。攻撃された側も、自分の攻撃力ぶん反撃します。</li>
        <li><b>貫通</b>は、倒した相手の体力を超えた分が拠点に届きます。</li>
      </ul>

      <h2 id="h-resv">未来予約</h2>
      <ul class="dots">
        <li>術を使う代わりに、未来の時刻を指定して伏せられます。コストは同じで、今払います。</li>
        <li>指定できるのは「支払い後の自分の時計+1」から<span data-v="END"></span>刻まで。世界の時刻（両者の時計の遅い方）がその刻に届くと発動します。</li>
        <li>予約から発動した術は<b>必ず強化</b>されます（カードの「予約」の行）。強化されるのは最初の効果だけで、残響は強化されず、予約が発動した時刻から数えます。充填のXは0になります。</li>
        <li>相手には伏せた時刻だけが見え、中身は見えません。「予見の巫女」「覗き時計」で公開、「刻壊し」「破約の刃」で破棄されます。</li>
      </ul>

      <h2 id="h-text">カードの書き方</h2>
      <ul class="dots">
        <li><span class="fx-minus">−3</span> はダメージ（朱色）。「敵拠点<span class="fx-minus">−4</span>」「敵全体<span class="fx-minus">−2</span>」のように使います。</li>
        <li><span class="fx-plus">+3</span> は回復や強化（空色）。「自拠点<span class="fx-plus">+3</span>」は3回復です。</li>
        <li>「相手の時計<span class="fx-plus">+2</span>」は相手の時計を2進める、「自分の時計<span class="fx-minus">−1</span>」は自分の時計を1戻す。「準備<span class="fx-plus">+6</span>」は攻撃できるまで6刻遅らせます。</li>
        <li><span class="fx-plus">+1/+1</span> は攻撃と体力が1ずつ上がる、<span class="fx-plus">+1/-</span> は攻撃だけ上がる（体力は変わらない）。</li>
        <li>「残響3：もう一度」は、3刻後に同じ効果がもう一度起きることです。</li>
      </ul>

      <h2 id="h-end">勝敗</h2>
      <h3>時間切れの判定</h3>
      <p>両者の時計が<span data-v="END"></span>刻に届いた時点で、拠点の体力が多い方の勝ち。体力が同じなら、場に残っているユニットの<b>攻撃力と体力の合計</b>が大きい方の勝ち。それも同じなら引き分けです。</p>
      <h3>山札切れ</h3>
      <p>山札がなくなってもダメージは受けません。ドローの行動と鐘のドローができなくなるだけです。</p>
    </template>

    <template id="t-keywords">
      <div id="kwlist" data-ctx="キーワードの代表カード"></div>
    </template>

    <template id="t-tips">
      <h2 id="h-t1">コストは「相手に渡す時間」</h2>
      <p>5コストのユニットを出すと、相手はその間に1コストの行動を最大5回できます。重いカードを出す前に、相手がその時間で何をしてくるかを考えましょう。逆に、相手が大型を出した直後は、攻撃（1刻）を何回も差し込むチャンスです。</p>
      <h2 id="h-t2">ドローは割高、鐘で引く</h2>
      <p>ドローの行動は<span data-v="COST_DRAW"></span>刻で1枚。鐘は無料で1枚です。鐘の直前に、どうせ必要な行動（召喚や攻撃）で鐘を越えるのが基本。手札が<span data-v="MAX_HAND"></span>枚のときに鐘を越えると、引いたカードが燃えてしまうので注意。</p>
      <h2 id="h-t3">攻撃は1刻、間隔を数える</h2>
      <p>攻撃は最も安い行動です。間隔1のユニット（秒針の斥候、早鐘の射手など）は刻ごとに殴れるので、時計の使い方が細かくなります。空いたレーンから拠点を狙うか、正面の敵を倒すかは、相手の反撃力と終焉の段階で決めます。</p>
      <h2 id="h-t4">予約は強化と奇襲</h2>
      <p>予約した術は強化版で発動します。さらに相手には中身が見えないので、相手の大型ユニットが出そうな時刻に「時の矢」や「崩落の刻」を置いておくと刺さります。シミュレーションのAIも「停滞の檻」「時間停止」「未来視」「逆転の針」はほぼ必ず予約で使っています。</p>
      <p>ただし予約したカードは発動まで手札から消えたままです。相手に「刻壊し」や「破約の刃」があると壊されます。</p>
      <h2 id="h-t5">終焉を数える</h2>
      <div class="box doom">世界の時刻<span data-v="DOOM_AT"></span>刻からは、ユニットの攻撃で拠点に与えるダメージが増えていきます（<span data-v="DOOM_LIST"></span>）。間隔の短いユニットで何度も殴れる盤面ほど、終盤の圧力が強くなります。術や残響の拠点ダメージは増えないので、終盤は盤面を取った側が押し切りやすくなります。</div>
      <h2 id="h-t6">時計を進める＝連続行動</h2>
      <p>「時間停止」「逆転の針」「遅延術師」は相手の時計を進めます。その分だけ自分が続けて動けます。相手の時計を進めると自分が2刻以上遅れやすくなり、<b>急襲</b>が有効になるので、急襲デッキとの相性が特に良い組み合わせです。</p>
      <h2 id="h-t7">体力リードは守り切る</h2>
      <p>時間切れの時点で体力が多ければ勝ちです。体力で勝っているなら、挑発ユニットと回復（巻き戻し、残響の祈り）で時計を進めるだけでも勝てます。同点なら場のユニットの攻撃+体力の合計で決まるので、最後にユニットを並べておくのが効きます。</p>
      <h2 id="h-t8">挑発の置き場所</h2>
      <p>挑発が守れるのは自分のレーンと、<b>隣の空いたレーン</b>だけです。真ん中のレーンに置くと両隣を守れます。端に置くと反対側の端は守れません。</p>
      <h2 id="h-t9">残響には上限がある</h2>
      <p>残響は予約の枠を使いませんが、同時に<span data-v="MAX_ECHO"></span>つまでです。「残響の嵐」（残響2つ）と「永劫回帰」（残響2つ）を続けて使うと、超えた分が不発になります。残響が消化されるのを待ってから次を使いましょう。</p>
    </template>

    <template id="t-packs">
      <h2 id="h-pack">パックの中身と確率</h2>
      <p>第1弾「残響の刻」のカード<span data-v="ECHO_COUNT"></span>種はパックから手に入ります。コインは対戦で手に入り、課金はありません。基本セットの<span data-v="BASE_COUNT"></span>種は最初から全部持っています。</p>
      <div class="tw"><table class="gt">
        <tr><th colspan="2">1パック <span data-v="PACK_PRICE"></span>コイン・<span data-v="PACK_SIZE"></span>枚</th></tr>
        <tr><td>1〜3枚目</td><td>通常</td></tr>
        <tr><td>4枚目</td><td>希少</td></tr>
        <tr><td>5枚目</td><td data-v="LAST_SLOT"></td></tr>
      </table></div>
      <p class="small mute">伝説が出ないまま<span data-v="PITY"></span>パック目で確定（天井）。伝説はまだ持っていないものが優先して出ます。</p>

      <h2 id="h-coin">コインの報酬</h2>
      <div class="tw"><table class="gt" id="rewards"></table></div>
      <p class="small mute">対戦の報酬は1日<span data-v="DAILY_CAP"></span>コインまで。自分の行動が<span data-v="MIN_ACTIONS"></span>回未満の対戦と降参はコインなし。</p>

      <h2 id="h-shard">欠片（重複カード）</h2>
      <div class="tw"><table class="gt" id="shards"></table></div>
      <p class="small mute">上限枚数（<span data-v="MAX_COPIES"></span>枚、伝説<span data-v="MAX_LEGEND_COPIES"></span>枚）を超えた分が欠片になります。</p>

      <h2 id="h-other">そのほかの入手手段</h2>
      <ul class="dots">
        <li>はじめにパックチケット3枚</li>
        <li>ログインボーナス（7日周期、7日目はチケット）</li>
        <li>デイリーミッション3つと全達成ボーナス</li>
        <li>初心者ミッション</li>
        <li>ランクアップごとにコイン、5の倍数でチケット</li>
      </ul>

      <h2 id="h-eff">効率よく集めるには</h2>
      <ul class="dots">
        <li>毎日まず1勝して、その日の初勝利ボーナス（+<span data-v="DAILY_BONUS"></span>）を取る。</li>
        <li>勝てるなら「つよい」AIの方が1勝あたりのコインが多く、ランクのEXPも1.5倍。</li>
        <li>欠片は、欲しい秘宝を狙って作るのが効率的。伝説の作成は重いので、天井を待つ方が早いことが多いです。</li>
        <li>第1弾は1日5戦ほどで約1週間でコンプリートできる設計です。</li>
      </ul>
    </template>

    <template id="t-real">
      <p class="small mute">「影響」＝そのカードを使った試合の勝率 − 同じ対戦モードでの平均勝率。相手の強さの違いなどを差し引いた、カードそのものの効き目の目安です。使われた試合が<span data-v="REAL_MIN"></span>未満のカードは参考値として薄く表示します。</p>
      <div class="frow" style="margin-top:10px">
        <label>バージョン <select id="real-ver"></select></label>
        <span id="real-sum" class="small mute"></span>
      </div>

      <div id="real-body" data-ctx="実戦データ"><p class="mute">読み込み中…</p></div>
    </template>

      <p class="small mute">サーバーの管理用トークン（ADMIN_TOKEN）がある人だけが読めます。トークンはこの端末にだけ保存されます。</p>
      <div class="frow">

      <div id="adm-list"></div>
      <div id="adm-game"></div>
    </template>
